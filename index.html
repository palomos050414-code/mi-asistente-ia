<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentina · Asesora de maquillaje</title>
  <meta name="color-scheme" content="dark light">
  <!-- Único script en línea: fija tema y paleta antes del primer pintado para evitar el parpadeo (la lógica real vive en script.js) -->
  <script>
    (function () {
      try {
        var d = document.documentElement, t = localStorage.getItem('tema_asistente'), a = localStorage.getItem('acento_asistente');
        if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
        d.dataset.tema = t;
        d.dataset.acento = (a === 'rosa' || a === 'coral') ? a : 'violeta';
      } catch (e) { /* sin almacenamiento: valen los valores por defecto del CSS */ }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div class="app menu-oculto" id="app">

    <!-- Barra lateral: configuración de la clave de Alibaba Cloud (Model Studio) -->
    <aside class="sidebar" id="sidebar" aria-label="Configuración">
      <h2>Configuración</h2>

      <form id="form-clave" class="clave-form" autocomplete="off">
        <label for="input-clave">Clave de Alibaba Cloud (Model Studio)</label>
        <input type="password" id="input-clave" placeholder="Pega tu clave API (sk-...) aquí" autocomplete="off">
        <div class="clave-botones">
          <button type="submit" class="btn-primario">Guardar</button>
          <button type="button" id="btn-borrar-clave" class="btn-secundario">Borrar clave</button>
        </div>
      </form>

      <p id="aviso-clave" class="aviso" role="status"></p>

      <!-- Selector de paleta: radios nativos (navegación con flechas) -->
      <fieldset class="paleta" id="selector-acento">
        <legend>Color de acento</legend>
        <div class="paleta-opciones">
          <input type="radio" name="acento" id="acento-violeta" value="violeta" class="sr-only">
          <label for="acento-violeta" class="muestra muestra-violeta" title="Violeta"><span class="sr-only">Violeta</span></label>
          <input type="radio" name="acento" id="acento-rosa" value="rosa" class="sr-only">
          <label for="acento-rosa" class="muestra muestra-rosa" title="Rosa"><span class="sr-only">Rosa</span></label>
          <input type="radio" name="acento" id="acento-coral" value="coral" class="sr-only">
          <label for="acento-coral" class="muestra muestra-coral" title="Coral"><span class="sr-only">Coral</span></label>
        </div>
      </fieldset>
    </aside>

    <div class="contenido">

      <!-- Barra superior: logo y botones -->
      <header class="topbar">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <path fill="currentColor" d="M12 2c-1.7 2.8-6 4.6-6 9a6 6 0 0 0 12 0c0-4.4-4.3-6.2-6-9z"/>
          </svg>
        </div>
        <button id="btn-sidebar" class="btn-icono" aria-label="Mostrar u ocultar barra lateral" aria-controls="sidebar" aria-expanded="false">☰</button>
        <button id="btn-nuevo" class="btn-icono" aria-label="Nuevo chat">+</button>
        <!-- Interruptor de tema: cara feliz rosa claro en modo claro, cara triste café claro en modo oscuro -->
        <button id="btn-tema" class="btn-icono btn-tema" aria-label="Cambiar a modo claro">
          <svg class="icono-feliz" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="#ffc4d9" stroke="#7a2c4d" stroke-width="1.4"/>
            <circle cx="8.6" cy="9.6" r="1.5" fill="#5a1d36"/>
            <circle cx="15.4" cy="9.6" r="1.5" fill="#5a1d36"/>
            <path d="M7.5 14c1 2.6 3 3.8 4.5 3.8s3.5-1.2 4.5-3.8" fill="none" stroke="#5a1d36" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg class="icono-triste" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="#d2ad84" stroke="#6b4423" stroke-width="1.4"/>
            <circle cx="8.6" cy="9.6" r="1.5" fill="#3b2412"/>
            <circle cx="15.4" cy="9.6" r="1.5" fill="#3b2412"/>
            <path d="M7.5 17c1-2.6 3-3.8 4.5-3.8s3.5 1.2 4.5 3.8" fill="none" stroke="#3b2412" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <!-- Zona de conversación -->
      <main class="chat" id="chat">
        <section class="bienvenida" id="bienvenida">
          <!-- Ilustración: labial (usa currentColor y variables del tema) -->
          <div class="ilustracion" aria-hidden="true">
            <svg viewBox="0 0 120 140" width="96" height="112">
              <circle class="destello" cx="96" cy="28" r="3" fill="var(--acento)"/>
              <circle class="destello destello-2" cx="24" cy="46" r="2.2" fill="var(--acento)"/>
              <circle class="destello destello-3" cx="88" cy="60" r="1.6" fill="var(--acento)"/>
              <path d="M50 66V42l15-18q5-4 5 3v39z" fill="var(--acento)"/>
              <rect x="46" y="66" width="28" height="12" rx="2" fill="currentColor" opacity=".55"/>
              <rect x="42" y="78" width="36" height="44" rx="5" fill="currentColor"/>
              <rect x="42" y="92" width="36" height="4" fill="var(--fondo)" opacity=".4"/>
              <ellipse cx="60" cy="132" rx="26" ry="4" fill="var(--acento)" opacity=".2"/>
            </svg>
          </div>
          <h1>¡Hola! ¿De qué quieres hablar hoy?</h1>
        </section>
        <div class="mensajes" id="mensajes"></div>
      </main>

      <!-- Cuadro de entrada -->
      <footer class="pie">
        <form id="form-chat" class="entrada">
          <label for="mensaje" class="sr-only">Escribe tu mensaje</label>
          <textarea id="mensaje" rows="1" placeholder="Mensaje al asistente de maquillaje"></textarea>

          <div class="entrada-barra">
            <div class="chips">
              <!-- "Pensamiento Profundo" activa el modelo de razonamiento; "Búsqueda inteligente" es decorativa -->
              <button type="button" id="btn-pensamiento" class="chip" aria-pressed="false" title="Modo razonamiento profundo: respuestas más elaboradas, pero tarda más en empezar">Pensamiento Profundo</button>
              <span class="chip chip-acento">Búsqueda inteligente</span>
            </div>

            <div class="entrada-acciones">
              <button type="button" class="btn-icono" aria-label="Adjuntar archivo (no disponible)">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.5 3.5 0 0 1 5 5L10.5 18a2 2 0 0 1-3-3L16 6.5"/>
                </svg>
              </button>
              <button type="submit" id="btn-enviar" class="btn-enviar" aria-label="Enviar mensaje">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
              </button>
            </div>
          </div>
        </form>
      </footer>
    </div>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
